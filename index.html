<style>
:root{--bg:#0b0b10;--fg:#f4f1ea;--mut:#a9a6b3;--card:#16161f;--line:#2a2a36;--acc:#f2c14e;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,.serif{font-family:Fraunces,Georgia,serif}
.hidden{display:none!important}

/* ---------- Onboarding ---------- */
#onb{position:fixed;inset:0;overflow-y:auto;padding:calc(var(--safe-t) + 28px) 22px calc(var(--safe-b) + 110px);background:radial-gradient(120% 60% at 50% 0%,#2a2140 0%,var(--bg) 60%)}
.step{max-width:560px;margin:0 auto;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.prog{display:flex;gap:6px;max-width:560px;margin:0 auto 26px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--acc)}
.step h1{font-size:30px;line-height:1.15;margin-bottom:10px}
.step p.sub{color:var(--mut);font-size:15px;line-height:1.5;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:12px 15px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:15px;font-weight:500;transition:.15s}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1b1607}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:16px 18px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);transition:.15s}
.opt b{display:block;font-size:16px;margin-bottom:3px}
.opt span{color:var(--mut);font-size:14px}
.opt.on{border-color:var(--acc);background:#221d10}
.navbar{position:fixed;left:0;right:0;bottom:0;padding:14px 22px calc(var(--safe-b) + 14px);background:linear-gradient(transparent,var(--bg) 35%);display:flex;gap:10px;justify-content:center}
.navbar .in{display:flex;gap:10px;width:100%;max-width:560px}
.btn{flex:1;padding:16px;border-radius:14px;font-weight:700;font-size:16px;background:var(--acc);color:#1b1607}
.btn:disabled{opacity:.35}
.btn.ghost{flex:0 0 auto;background:var(--card);color:var(--fg);border:1px solid var(--line);padding:16px 20px}
.count{color:var(--mut);font-size:13px;margin-top:14px}

/* ---------- Feed ---------- */
#app{position:fixed;inset:0}
#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(var(--safe-t) + 70px) 78px calc(var(--safe-b) + 34px) 22px;overflow:hidden}
.card .bgemoji{position:absolute;top:calc(var(--safe-t) + 70px);right:-20px;font-size:190px;opacity:.16;transform:rotate(-8deg);pointer-events:none;user-select:none}
.card .pill{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 11px;border-radius:999px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);margin-bottom:14px}
.card h2{font-size:clamp(26px,7.4vw,40px);line-height:1.12;margin-bottom:14px;text-wrap:balance}
.card .body{font-size:17px;line-height:1.55;color:rgba(255,255,255,.9);max-width:620px}
.card .more{margin-top:14px;font-size:15px;line-height:1.5;color:rgba(255,255,255,.75);border-left:3px solid rgba(255,255,255,.35);padding-left:12px;max-width:620px}
.card .cta{margin-top:20px;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;background:#fff;color:#111;font-weight:700;font-size:15px;text-decoration:none}
.card .note{font-size:12px;color:rgba(255,255,255,.55);margin-top:8px}
.side{position:absolute;right:12px;bottom:calc(var(--safe-b) + 40px);display:flex;flex-direction:column;gap:18px;align-items:center}
.side button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:rgba(255,255,255,.85)}
.side .ic{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:22px;transition:transform .15s}
.side button:active .ic{transform:scale(.88)}
.side .on .ic{background:var(--acc)}
.top{position:fixed;top:0;left:0;right:0;padding:calc(var(--safe-t) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;z-index:5;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
.top > *{pointer-events:auto}
.logo{font-family:Fraunces,serif;font-weight:800;font-size:22px}
.logo span{color:var(--acc)}
.tbtns{display:flex;gap:8px}
.tbtn{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:18px}
.timer{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);color:var(--mut)}
.card.yt{padding:calc(var(--safe-t) + 64px) 0 calc(var(--safe-b) + 24px);justify-content:center;background:#07070b}
.card.yt .frame{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.card.yt .mount,.card.yt .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.card.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.card.yt .meta{padding:18px 78px 0 18px}
.card.yt .meta .pill{display:inline-block}
.card.yt .meta h2{font-size:24px;margin:10px 0 6px}
.card.yt .meta p{color:var(--mut);font-size:14px;line-height:1.5}
.card.yt .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:14px}
.card.film{padding:0;justify-content:center;background:#000}
.card.film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card.film .side{z-index:2}
.sound{position:absolute;left:16px;bottom:calc(var(--safe-b) + 40px);z-index:2;padding:10px 14px;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);font-weight:600;font-size:14px}
.vprog{position:absolute;left:0;right:0;bottom:var(--safe-b);height:3px;background:rgba(255,255,255,.15);z-index:2}.vprog i{display:block;height:100%;width:0;background:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 24px);transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- Sheets ---------- */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{width:100%;max-width:600px;max-height:86vh;overflow-y:auto;background:#14141c;border-radius:22px 22px 0 0;padding:22px 20px calc(var(--safe-b) + 24px);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.panel h3{font-family:Fraunces,serif;font-size:22px;margin-bottom:6px}
.panel .sub{color:var(--mut);font-size:14px;margin-bottom:16px;line-height:1.5}
.panel label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
.panel input,.panel select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:16px}
.row{display:flex;gap:10px;margin-top:18px}
.saved-item{padding:14px 0;border-bottom:1px solid var(--line)}
.saved-item b{display:block;margin-bottom:3px}
.saved-item small{color:var(--mut)}
.saved-item a{color:var(--acc);font-size:14px}
.bars{display:flex;flex-direction:column;gap:8px;margin:8px 0 6px}
.bar{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;font-size:13px}
.bar div{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar div i{display:block;height:100%;background:var(--acc)}
.linkbtn{color:var(--acc);font-weight:600;font-size:15px;padding:8px 0}
</style>
</head>
<body>

<!-- Onboarding -->
<div id="onb"></div>

<!-- App -->
<div id="app" class="hidden">
  <div class="top">
    <div class="logo">Klog<span>Feed</span></div>
    <div class="tbtns">
      <span class="timer" id="timer"></span>
      <button class="tbtn" id="soundBtn" aria-label="Lyd">🔇</button>
      <button class="tbtn" id="addBtn" aria-label="Tilføj video">＋</button>
      <button class="tbtn" id="savedBtn" aria-label="Gemte">🔖</button>
      <button class="tbtn" id="profBtn" aria-label="Profil">⚙︎</button>
    </div>
  </div>
  <div id="feed"></div>
</div>

<div id="sheet" class="sheet hidden"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

  } else {
    h+=`<div class="opts">${q.o.map(x=>`<button class="opt ${ans[q.k]===x.v?"on":""}" data-v="${x.v}"><b>${x.l}</b>${x.d?`<span>${x.d}</span>`:""}</button>`).join("")}</div>`;

  o.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const v=b.dataset.m;ans[q.k]=ans[q.k].includes(v)?ans[q.k].filter(c=>c!==v):[...ans[q.k],v];if(q.k==="cats")ans._touched=true;else ans._touched=false;renderQ()});

let recentCats=[];
function typeWeight(y){
  const g=profile.goals||[]; let w=1;
  if(y==="d") w*= g.includes("under")?1.4:0.7;
  if(y==="m") w*= g.includes("motiv")?1.6:0.5;
  if(y==="f") w*= g.includes("klog")?1.3:1;
  return w;
}
function ytId(u){const m=String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:null}
function pool(){return [...FILMS, ...YT, ...custom.map(v=>ytId(v.u)?{...v,y:"yt",v:ytId(v.u),n:"Din video",d:v.b||""}:{...v,y:"v"})]}
function pick(){
  let items=pool().filter(it=>it.u||!seen.has(id(it)));
  if(items.length<3){seen=new Set();items=pool()}
  const sc=items.map(it=>{
    let w=(weights[it.c]??0.15)*(it.y==="v"||it.y==="film"?2.5:it.y==="yt"?(it.u?6:4):typeWeight(it.y));
    if(recentCats.slice(-2).includes(it.c)) w*=0.25;   // undgå samme emne tre gange i træk
    return Math.max(w,0.02);
  });
  let r=Math.random()*sc.reduce((a,b)=>a+b,0);
  for(let i=0;i<items.length;i++){r-=sc[i];if(r<=0)return items[i]}
  return items[items.length-1];
}
const id=it=>it.c+"|"+it.t;
function ytUrl(it){
  if(it.u) return it.u;
  const q=profile.lang==="da"?it.q+" dansk":it.q;
  return "https://www.youtube.com/results?search_query="+encodeURIComponent(q);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function stopCard(){
  return `<section class="card stop" style="background:linear-gradient(160deg,#2b2f1a,#0b0b10 75%);justify-content:center;padding-right:22px">

let stopShown=false;
function fill(n){
  const f=$("#feed");
  for(let i=0;i<n;i++){
    if(overLimit()){ if(!stopShown){f.insertAdjacentHTML("beforeend",stopCard());stopShown=true;bindStop()} return }
    const it=pick(); seen.add(id(it)); recentCats.push(it.c);
    f.insertAdjacentHTML("beforeend",cardHTML(it));
  }
  LS.set("seen",[...seen]);
}
function bindStop(){const b=$("#moreAnyway");if(b)b.onclick=()=>{limitOverride=true;usage.s=Math.max(0,profile.limit*60-300);stopShown=false;b.closest(".card").remove();fill(4)}}
function overLimit(){return profile.limit>0 && usage.s>=profile.limit*60 && !limitOverride}

$("#feed").addEventListener("scroll",()=>{
  const f=$("#feed"); if(f.scrollTop+f.clientHeight*3>f.scrollHeight) fill(4);
},{passive:true});

$("#feed").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b)return;
  const card=b.closest(".card"), c=card.dataset.c, k=card.dataset.k, a=b.dataset.a;
  if(a==="like"){weights[c]=(weights[c]||0)+1.5;LS.set("weights",weights);toast("Mere "+CATS[c].n.toLowerCase()+" 👍")}
  if(a==="less"){weights[c]=Math.max(0.05,(weights[c]||0)*0.4);LS.set("weights",weights);toast("Mindre "+CATS[c].n.toLowerCase());next(card)}
  if(a==="save"){
    const i=saved.findIndex(s=>s.k===k);
    if(i>=0){saved.splice(i,1);b.classList.remove("on");toast("Fjernet fra gemte")}
    else{const it=pool().find(x=>id(x)===k);saved.unshift({k,t:it.t,c,u:it.y==="v"?it.u:it.y==="film"?"#":it.y==="yt"?(it.v?`https://www.youtube.com/watch?v=${it.v}`:`https://www.youtube.com/channel/${it.u}/videos`):ytUrl(it)});b.classList.add("on");toast("Gemt 🔖")}
    LS.set("saved",saved);
  }
});
function next(card){const f=$("#feed");f.scrollTo({top:card.offsetTop+f.clientHeight,behavior:"smooth"})}

const io=new IntersectionObserver(es=>es.forEach(e=>{
  const v=e.target.querySelector("video"); if(!v)return;
  if(e.isIntersecting&&e.intersectionRatio>0.6){v.muted=!soundOn;v.currentTime=0;v.play().catch(()=>{v.muted=true;v.play().catch(()=>{})})}
  else v.pause();
}),{threshold:[0,0.6,1]});
new MutationObserver(()=>document.querySelectorAll(".card.film:not([data-o])").forEach(c=>{
  c.dataset.o=1; io.observe(c); const v=c.querySelector("video"), bar=c.querySelector(".vprog i"), sb=c.querySelector(".sound");
  v.addEventListener("timeupdate",()=>{bar.style.width=(v.currentTime/v.duration*100||0)+"%"});
  const upd=()=>sb.textContent=v.muted?"🔇 Tryk for lyd":"🔊 Lyd til";
  sb.onclick=e=>{e.stopPropagation();setSound(v.muted);if(v.paused)v.play().catch(()=>{});upd()};
  v.onclick=()=>{v.paused?v.play().catch(()=>{}):v.pause()};
  v.addEventListener("volumechange",upd);
  v.addEventListener("ended",()=>next(c));
})).observe(document.getElementById("feed"),{childList:true});

const BAD=/trailer|teaser|anniversary|announce|giveaway|sale\b|merch|livestream|\blive\b|q&a|\bgame\b|gameplay|master of command|fire & maneuver|patreon|sponsor|update video|channel update|reveal/i;
let ytReady=false; const ytQueue=[];
window.onYouTubeIframeAPIReady=()=>{ytReady=true;ytQueue.splice(0).forEach(f=>f())};
(function(){const t=document.createElement("script");t.src="https://www.youtube.com/iframe_api";document.head.appendChild(t)})();
function startPlayer(c){
  if(c._player) { try{ soundOn?c._player.unMute():c._player.mute(); c._player.playVideo() }catch(e){} return }
  const fr=c.querySelector(".frame"); let m=fr.querySelector(".mount"); if(!m){m=document.createElement("div");m.className="mount";fr.appendChild(m)}
  const vars={autoplay:1,mute:soundOn?0:1,playsinline:1,rel:0,modestbranding:1,controls:1};
  const opts={host:"https://www.youtube-nocookie.com",width:"100%",height:"100%",playerVars:vars,events:{
    onReady:e=>{ if(soundOn)e.target.unMute(); else e.target.mute(); e.target.playVideo(); fr.querySelector(".ph")&&(fr.querySelector(".ph").style.display="none") },
    onStateChange:e=>{
      if(e.data===1){ try{ const t=(e.target.getVideoData().title||"");
        if(BAD.test(t)){ if(c.dataset.u) e.target.nextVideo(); else next(c) }
        else { const h=c.querySelector(".meta h2"); if(c.dataset.u&&h&&t) h.textContent=t } }catch(err){} }
      if(e.data===0) next(c) },
    onError:()=>{ fr.querySelector(".ph").textContent="Videoen kunne ikke afspilles – swipe videre"; }
  }};
  if(c.dataset.v) opts.videoId=c.dataset.v;
  else { vars.listType="playlist"; vars.list="UU"+c.dataset.u.slice(2); vars.index=Math.floor(Math.random()*40) }
  c._player=new YT.Player(m,opts);
}
function stopPlayer(c){ if(c._player){ try{c._player.destroy()}catch(e){} c._player=null; const fr=c.querySelector(".frame"); fr.innerHTML='<div class="ph">▶ Video</div><div class="mount"></div>' } }
const ytio=new IntersectionObserver(es=>es.forEach(e=>{
  const c=e.target;
  if(e.isIntersecting&&e.intersectionRatio>0.6){ ytReady?startPlayer(c):ytQueue.push(()=>startPlayer(c)) }
  else if(!e.isIntersecting) stopPlayer(c);
}),{threshold:[0,0.6]});
let soundOn=false;
function setSound(on){ soundOn=on; const b=document.getElementById("soundBtn"); if(b) b.textContent=on?"🔊":"🔇";
  document.querySelectorAll(".card.yt").forEach(c=>{ if(c._player){ try{ on?c._player.unMute():c._player.mute() }catch(e){} } });
  document.querySelectorAll(".card.film video").forEach(v=>v.muted=!on); }
new MutationObserver(()=>document.querySelectorAll(".card.yt:not([data-o])").forEach(c=>{c.dataset.o=1;ytio.observe(c)}))
  .observe(document.getElementById("feed"),{childList:true});

/* ================== Timer ================== */
setInterval(()=>{
  if(document.hidden||$("#app").classList.contains("hidden"))return;
  usage.s++; if(usage.s%5===0)LS.set("usage",usage);
  const m=Math.floor(usage.s/60);
  $("#timer").textContent=profile.limit?`${m}/${profile.limit} min`:`${m} min`;
},1000);

document.getElementById("soundBtn").onclick=()=>setSound(!soundOn);

/* ================== Sheets ================== */
function openSheet(h){$("#panel").innerHTML=h;$("#sheet").classList.remove("hidden")}
function closeSheet(){$("#sheet").classList.add("hidden")}
$("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};

$("#savedBtn").onclick=()=>{
  openSheet(`<h3>Gemte</h3><p class="sub">Ting du vil vende tilbage til.</p>
   ${saved.length?saved.map(s=>`<div class="saved-item"><b>${esc(s.t)}</b><small>${CATS[s.c]?CATS[s.c].e+" "+CATS[s.c].n:""}</small><br><a href="${esc(s.u)}" target="_blank" rel="noopener">▶ Åbn video</a></div>`).join(""):`<p class="sub">Intet gemt endnu. Tryk 🔖 på et kort.</p>`}
   <div class="row"><button class="btn" onclick="closeSheet()">Luk</button></div>`);
};

$("#addBtn").onclick=()=>{
  openSheet(`<h3>Tilføj din egen video</h3><p class="sub">Indsæt et YouTube-link, så afspilles videoen direkte i dit feed.</p>
   <form id="addForm">
    <label>Link (YouTube, DR TV, osv.)</label><input id="aU" type="url" placeholder="https://youtube.com/watch?v=..." required>
    <label>Titel</label><input id="aT" placeholder="Fx ’Romerrigets fald’" required>
    <label>Beskrivelse (valgfri)</label><input id="aB" placeholder="Hvorfor er den god?">
    <label>Emne</label><select id="aC">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.e} ${v.n}</option>`).join("")}</select>
    <div class="row"><button type="button" class="btn ghost" onclick="closeSheet()">Annullér</button><button class="btn">Tilføj</button></div>
   </form>
   ${custom.length?`<label style="margin-top:22px">Dine videoer (${custom.length})</label>${custom.map((v,i)=>`<div class="saved-item"><b>${esc(v.t)}</b><button class="linkbtn" data-del="${i}">Fjern</button></div>`).join("")}`:""}`);
  $("#addForm").onsubmit=e=>{
    e.preventDefault();
    const u=$("#aU").value.trim(); if(!/^https?:\/\//.test(u)){toast("Linket skal starte med https://");return}
    const v={c:$("#aC").value,t:$("#aT").value.trim(),b:$("#aB").value.trim(),u};
    custom.push(v);LS.set("custom",custom);closeSheet();
    $("#feed").insertAdjacentHTML("beforeend",cardHTML({...v,y:"v"}));
    toast("Tilføjet til dit feed ✅");
  };
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{custom.splice(+b.dataset.del,1);LS.set("custom",custom);$("#addBtn").onclick()});
};

$("#profBtn").onclick=()=>{
  const tot=Object.values(weights).reduce((a,b)=>a+b,0)||1;
  const top=Object.entries(weights).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const gl=(profile.goals||[]).map(g=>({klog:"blive klogere",under:"underholdning",motiv:"motivation",nyheder:"forstå nyhederne"}[g])).join(", ");
  openSheet(`<h3>Din profil</h3><p class="sub">Feedet lærer af dine 👍 og 👎. Sådan ser dine interesser ud lige nu:</p>
   <div class="bars">${top.map(([k,w])=>`<div class="bar"><span>${CATS[k].e} ${CATS[k].n}</span><div><i style="width:${Math.round(w/top[0][1]*100)}%"></i></div></div>`).join("")}</div>
   <p class="sub" style="margin-top:14px">Mål: ${gl} · Tidsgrænse: ${profile.limit?profile.limit+" min/dag":"ingen"} · I dag: ${Math.floor(usage.s/60)} min</p>
   <div class="row"><button class="btn ghost" onclick="closeSheet()">Luk</button><button class="btn" id="redo">Tag spørgeskemaet igen</button></div>`);
  $("#redo").onclick=()=>{closeSheet();startQuiz(profile)};
};

/* ================== Start ================== */
if(!profile||profile.v!==3){applyProfile(JSON.parse(JSON.stringify(CHAT_PROFILE)));seen=new Set();var fromChat=true}
$("#onb").classList.add("hidden");$("#app").classList.remove("hidden");
FILMS.forEach(f=>{if(!LS.get("film_"+id(f),false)){$("#feed").insertAdjacentHTML("beforeend",cardHTML(f));seen.add(id(f));recentCats.push(f.c);LS.set("film_"+id(f),true)}});
fill(6);
if(typeof fromChat!=="undefined")setTimeout(()=>toast("Profil sat op ud fra dine svar ✨"),400);
</script>
